# XcodeGen config — generates Pandia.xcodeproj from this file. Nobody edits
# the .xcodeproj by hand or commits it; `xcodegen generate` (run by the
# GitHub Actions workflow, see .github/workflows/build.yml) regenerates it
# fresh on every build. See native/README.md for why: no Mac in this loop
# to run Xcode's GUI project editor in the first place.
name: Pandia

options:
  bundleIdPrefix: com.ophelia.pandia
  deploymentTarget:
    iOS: "17.0"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
  # Stage 5 — on-device inference (see Sources/LocalBrain.swift's doc
  # comment for the full uncertainty note). This repo is the current home
  # of MLXLLM/MLXLMCommon as of the library's v3 split from
  # mlx-swift-examples; version pin taken from its own README.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  # Round 2 of Stage 5, added alongside MLXHuggingFace below: the
  # #hubDownloader()/#huggingFaceTokenizerLoader() macros LocalBrain.swift
  # uses expand to types from these two, so the calling file needs them in
  # scope too — see that file's doc comment and mlx-swift-lm's own
  # Documentation.docc/using.md.
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 0.1.0

targets:
  Pandia:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ophelia.pandia
        PRODUCT_NAME: Pandia
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Signing happens later, on-device, via AltServer + your free Apple
        # ID (see README) — not here. The build this config produces is
        # deliberately unsigned.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: SocketIO
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      # "Transformers" is the actual product name at the resolved version
      # (0.1.24) — confirmed from that tag's own Package.swift after CI
      # failed with "Missing package product 'Tokenizers'". The Tokenizers
      # *module* LocalBrain.swift imports still resolves fine once this is
      # right: it's a target bundled inside the Transformers product, not
      # a standalone product of its own at this version.
      - package: SwiftTransformers
        product: Transformers
